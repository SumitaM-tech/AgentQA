[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; sqlalchemy.url is intentionally omitted here — alembic/env.py reads
; DATABASE_URL from app.core.config.Settings instead, so the same
; environment-variable-driven config used by the app is used by migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
