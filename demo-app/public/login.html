<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Login - Demo Shop</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><script src="/common.js"></script></head>
<body style="font-family:sans-serif"><main style="padding:12px 16px"><h1>Login</h1>
<form onsubmit="return false"><label for="u">Username</label> <input id="u" type="text"><br><label for="p">Password</label> <input id="p" type="password"><br><button id="go" type="button">Sign in</button></form><p id="msg" role="alert"></p>
</main><script>

go.onclick=()=>{msg.textContent=(u.value==="demo"&&p.value==="demo123")?"Welcome, demo!":"Invalid username or password";};
</script></body></html>
