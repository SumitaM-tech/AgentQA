<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Products - Demo Shop</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><script src="/common.js"></script></head>
<body style="font-family:sans-serif"><main style="padding:12px 16px"><h1>Products</h1>
<ul id="list"></ul>
</main><script>

// BUG 1: console error on every load of the product list
console.error("catalog: failed to load featured banner config");
fetch("/api/products").then(r=>r.json()).then(ps=>{document.getElementById("list").innerHTML=ps.map(p=>`<li><a href="/product.html?id=${p.id}">${p.name}</a> — $${p.price}</li>`).join("")});
</script></body></html>
